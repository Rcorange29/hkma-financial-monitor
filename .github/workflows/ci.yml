name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Byte-compile all modules
        run: python -m compileall -q src scripts app
      - name: Run unit tests (standard library only)
        run: python -m unittest discover -s tests -v
      - name: Smoke-test the offline pipeline
        run: python scripts/run_pipeline.py --offline
